{% extends "base.html" %}

{% block title %}Movie, MoveIt{% endblock %}

{% block extra_style %}
<style>
    header {
        text-align: center;
        padding: 50px 20px 30px;
    }
    header h1 { font-size: 2.2rem; color: var(--text); }
    header p  { color: var(--text2); margin-top: 8px; }

    .search-box {
        display: flex;
        justify-content: center;
        margin: 20px auto;
        max-width: 500px;
        gap: 10px;
        padding: 0 20px;
    }
    .search-box input {
        flex: 1;
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 1rem;
        background: var(--bg2);
        color: var(--text);
    }
    .search-box button {
        padding: 12px 20px;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
    }
    .search-box button:hover { opacity: .85; }

    #results {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 20px;
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 20px;
    }
    .card {
        background: var(--bg2);
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        transition: transform .2s;
        border: 1px solid var(--border);
    }
    .card:hover { transform: scale(1.04); }
    .card img {
        width: 100%;
        aspect-ratio: 2/3;
        object-fit: cover;
        background: var(--bg3);
    }
    .card-info { padding: 10px; }
    .card-info h3   { font-size: 0.9rem; margin-bottom: 4px; color: var(--text); }
    .card-info span { font-size: 0.75rem; color: var(--text2); }

    #loading { text-align: center; color: var(--text2); margin-top: 40px; display: none; }
</style>
{% endblock %}

{% block content %}
<header>
    <h1>🎬 Movie, MoveIt</h1>
    <p id="headerDesc">영화를 검색하고 OTT 플랫폼을 확인하세요</p>
</header>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="영화 제목을 입력하세요..." />
    <button id="searchBtn" onclick="searchMovies()">검색</button>
</div>

<div id="loading">검색 중...</div>
<div id="results"></div>
{% endblock %}

{% block extra_script %}
<script>
    const headerDescs = {
        ko: '영화를 검색하고 OTT 플랫폼을 확인하세요',
        en: 'Search movies and find OTT platforms',
        ja: '映画を検索してOTTプラットフォームを確認しましょう'
    };

    // 언어 변경 시 index 페이지 텍스트 업데이트
    const _origChangeLang = window.changeLang;
    window.changeLang = function(lang) {
        _origChangeLang(lang);
        document.getElementById('headerDesc').textContent =
            headerDescs[lang] || headerDescs['ko'];
    };

    // 초기 headerDesc 적용
    document.getElementById('headerDesc').textContent =
        headerDescs[localStorage.getItem('lang') || 'ko'];

    // 엔터키 검색
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchMovies();
    });

    async function searchMovies() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        document.getElementById('loading').style.display = 'block';
        document.getElementById('results').innerHTML = '';

        const lang = localStorage.getItem('lang') || 'ko';
        const res = await fetch(`/search?q=${encodeURIComponent(query)}&lang=${lang}`);
        const movies = await res.json();

        document.getElementById('loading').style.display = 'none';

        if (movies.length === 0) {
            document.getElementById('results').innerHTML =
                `<p style="color:var(--text2);text-align:center;">
                    ${window.UI?.no_result || '검색 결과가 없습니다.'}
                </p>`;
            return;
        }

        movies.forEach(movie => {
            const poster = movie.poster_path
                ? `https://image.tmdb.org/t/p/w300${movie.poster_path}`
                : 'https://via.placeholder.com/300x450?text=No+Image';
            const year = movie.release_date?.slice(0,4) || window.UI?.unknown_year || '연도 미상';
            const lang = localStorage.getItem('lang') || 'ko';

            document.getElementById('results').innerHTML += `
                <div class="card" onclick="location.href='/movie/${movie.id}?lang=${lang}'">
                    <img src="${poster}" alt="${movie.title}">
                    <div class="card-info">
                        <h3>${movie.title}</h3>
                        <span>${year}</span>
                    </div>
                </div>
            `;
        });
    }
</script>
{% endblock %}
